name: build-native

# Manual only (workflow_dispatch), so it can never affect build-apk.
#
# box64 job: builds box64 (MIT) for arm64-v8a with the NDK, strips it, and
# AUTO-COMMITS it as app/src/main/jniLibs/arm64-v8a/libbox64.so together with
# its SHA-256 pin in app/src/main/assets/native/checksums.txt on the target
# branch. The fail-closed contract is untouched: the app still refuses any
# unpinned/mismatched binary (docs/NATIVE_RUNTIME.md). The push re-triggers
# build-apk, which validates unit tests + assembleDebug with the new binary.
#
# proot job: reproduces the build of the ALREADY-vendored proot (termux/proot
# v5.1.107.96 + Termux libtalloc; recipe in docs/NATIVE_RUNTIME.md) so the
# GPL-2.0 corresponding-source offer stays runnable on demand. It only uploads
# artifacts - re-vendoring proot is an owner decision, never automated.

on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: 'box64 git ref (tag/branch/commit)'
        required: false
        default: 'v0.4.4'
      commit_box64:
        description: 'Commit libbox64.so + its SHA-256 pin to the target branch'
        type: boolean
        required: false
        default: true
      target_branch:
        description: 'Branch the vendored libbox64.so is committed to'
        required: false
        default: 'main'
      proot_repo:
        description: 'proot repo (default reproduces the vendored termux/proot build)'
        required: false
        default: 'https://github.com/termux/proot.git'
      proot_ref:
        description: 'proot git ref'
        required: false
        default: 'v5.1.107.96'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  box64:
    name: box64 (arm64 Android) + auto-vendor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # pushes the vendored libbox64.so + its checksums.txt pin
    env:
      BOX64_REF: ${{ inputs.box64_ref }}
      TARGET_BRANCH: ${{ inputs.target_branch }}
    steps:
      - name: Checkout the branch that will receive the binary
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}

      - name: Build box64 with the NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "Using NDK: $NDK"
          git clone --depth 1 --branch "$BOX64_REF" https://github.com/ptitSeb/box64.git box64 || \
            git clone --depth 1 https://github.com/ptitSeb/box64.git box64
          BUILT_REF="$(git -C box64 describe --tags --always)"
          echo "BUILT_REF=$BUILT_REF" >> "$GITHUB_ENV"
          mkdir box64/build && cd box64/build
          # -DANDROID=ON is REQUIRED and easy to miss: NDK r27's toolchain file
          # does not set the plain ANDROID variable box64's option() reads.
          # Without it box64 configures as generic Linux: RelWithDebInfo keeps
          # -O2 (its gtkclass.c tables then need several GB of RAM), BAD_SIGNAL
          # and the -DANDROID code paths stay off, and the link line asks for
          # -lrt/-lpthread/-lresolv/-lutil - bionic merged those into libc and
          # the NDK sysroot does not ship them, so the link always fails.
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID=ON \
            -DARM_DYNAREC=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          # -j2 on purpose (not $(nproc)): even at -O1 (box64's ANDROID memory
          # hack), src/tools/gtkclass.c needs ~1-2 GB per clang process - the
          # README documents exactly this file OOM-killing a small sandbox.
          # Two parallel jobs peak well inside the runner's 16 GB.
          make -j2
          # The APK ships it as libbox64.so (AGP only packages lib*.so): rename
          # and strip so the artifact is drop-in for jniLibs/arm64-v8a and small
          # enough to commit (like every other vendored binary here).
          "$TC/bin/llvm-strip" --strip-all -o libbox64.so box64
          "$TC/bin/llvm-readelf" -h libbox64.so | grep -q AArch64 # architecture guard
          sha256sum libbox64.so | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: box64-arm64
          path: |
            box64/build/libbox64.so
            box64/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit libbox64.so + its SHA-256 pin
        if: ${{ inputs.commit_box64 }}
        run: |
          set -euo pipefail
          LIB=app/src/main/jniLibs/arm64-v8a/libbox64.so
          PINS=app/src/main/assets/native/checksums.txt
          cp box64/build/libbox64.so "$LIB"
          # Update the pin file in place: replace the existing libbox64.so pin or
          # its commented-out placeholder, and refresh the provenance comment.
          BOX64_BUILT_REF="$BUILT_REF" python3 - "$LIB" "$PINS" <<'PY'
          import hashlib, os, pathlib, sys
          lib, pins = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          digest = hashlib.sha256(lib.read_bytes()).hexdigest()
          ref = os.environ.get("BOX64_BUILT_REF") or "unknown ref"
          out, skip_block, pinned = [], False, False
          for line in pins.read_text().splitlines():
              if skip_block:
                  # continuation lines of the libbox64 provenance comment block
                  if line.startswith("#                      "):
                      continue
                  skip_block = False
              if line.startswith("#   libbox64.so"):
                  out.append(f"#   libbox64.so        ptitSeb/box64 {ref} (MIT), built and committed")
                  out.append("#                      by .github/workflows/build-native.yml (NDK, android-28,")
                  out.append("#                      ARM_DYNAREC=ON, llvm-strip'd).")
                  skip_block = True
                  continue
              if line.startswith("libbox64.so=") or line.startswith("# libbox64.so="):
                  out.append(f"libbox64.so={digest}")
                  pinned = True
                  continue
              out.append(line)
          if not pinned:
              out.append(f"libbox64.so={digest}")
          pins.write_text("\n".join(out) + "\n")
          print(f"pinned libbox64.so={digest}")
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LIB" "$PINS"
          if git diff --cached --quiet; then
            echo "libbox64.so and its pin are unchanged - nothing to commit."
            exit 0
          fi
          HASH="$(sha256sum "$LIB" | cut -d' ' -f1)"
          git commit -m "Vendor libbox64.so ($BUILT_REF, sha256 $HASH)" \
            -m "Built by .github/workflows/build-native.yml (box64 ref: ${BOX64_REF:-default}, NDK android-28, ARM_DYNAREC=ON, stripped). Pinned in app/src/main/assets/native/checksums.txt (fail closed). Licence: MIT - see docs/THIRD_PARTY.md."
          # Retry once through a rebase if the branch moved while we built.
          git push origin "HEAD:$TARGET_BRANCH" || {
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          }
          echo "Pushed to $TARGET_BRANCH - build-apk will validate the APK with the new binary."

  proot:
    # Inspection only. proot is GPL-2.0: whether to (re)vendor it stays an owner
    # decision, so this job uploads artifacts and never commits. What it builds is
    # the recipe in docs/NATIVE_RUNTIME.md - the same termux/proot tag, the same
    # Termux libtalloc with a respelled SONAME, the same two source patches - which
    # keeps the GPL-2.0 corresponding-source offer runnable on demand.
    name: proot (arm64 Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROOT_REPO: ${{ inputs.proot_repo }}
      PROOT_REF: ${{ inputs.proot_ref }}
      # Termux's prebuilt aarch64 libtalloc; proot's only dynamic dependency.
      TALLOC_DEB_URL: https://packages.termux.dev/apt/termux-main/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb
      TALLOC_DEB_SHA256: 556591f43bb773ad8777e1a29522640866a55f95dab71914418b94a8c58ad5a7
    steps:
      - uses: actions/checkout@v4

      - name: Stage libtalloc (sha256-pinned, SONAME respelled)
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/libtalloc.deb "$TALLOC_DEB_URL"
          echo "$TALLOC_DEB_SHA256  /tmp/libtalloc.deb" | sha256sum -c - # fail closed
          mkdir -p "$RUNNER_TEMP/talloc-out/lib" "$RUNNER_TEMP/talloc-out/include"
          dpkg-deb -x /tmp/libtalloc.deb /tmp/talloc-x
          # Respell the SONAME in .dynstr: "libtalloc.so.2\0" -> "libtalloc.so\0\0\0"
          # (exactly one occurrence, same byte length). That is what makes
          # -l:libtalloc.so record DT_NEEDED=libtalloc.so, the vendored file name,
          # and what lets AGP package the file from jniLibs.
          TALLOC_OUT="$RUNNER_TEMP/talloc-out" python3 - /tmp/talloc-x <<'PY'
          import os, pathlib, sys
          root = pathlib.Path(sys.argv[1]) / "data/data/com.termux/files/usr"
          out = pathlib.Path(os.environ["TALLOC_OUT"])
          blob = (root / "lib/libtalloc.so.2.5.0").read_bytes()
          old, new = b"libtalloc.so.2\x00", b"libtalloc.so\x00\x00\x00"
          found = blob.count(old)
          if found != 1:
              sys.exit(f"expected exactly one SONAME occurrence, found {found} - refusing to guess")
          out_blob = blob.replace(old, new, 1)
          assert len(out_blob) == len(blob), "respelling must not change the byte length"
          (out / "lib/libtalloc.so").write_bytes(out_blob)
          (out / "include/talloc.h").write_bytes((root / "include/talloc.h").read_bytes())
          print(f"staged {out/'lib/libtalloc.so'} ({len(out_blob)} bytes) + talloc.h")
          PY

      - name: Build proot with the NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          TALLOC_OUT="$RUNNER_TEMP/talloc-out"
          # gawk (not mawk) provides the strtonum() that loader-info.awk needs;
          # the makefile calls plain `awk`, so point the PATH lookup at gawk.
          sudo apt-get update -qq && sudo apt-get install -y -qq gawk
          sudo ln -sf "$(command -v gawk)" /usr/local/bin/awk
          git clone --depth 1 --branch "$PROOT_REF" "$PROOT_REPO" proot || \
            git clone --depth 1 "$PROOT_REPO" proot
          cd proot
          # Patch 1: disable the 32-bit loader. It needs an arm32 compile target
          # this workflow does not ship and the rootfs is arm64-only (both
          # occurrences in src/arch.h).
          sed -i 's|#define HAS_LOADER_32BIT true|/* HAS_LOADER_32BIT disabled: arm64-only rootfs */|' src/arch.h
          # Patch 2: link the staged talloc by exact file name, with RUNPATH=$ORIGIN
          # so libtalloc.so resolves next to the binary even if LD_LIBRARY_PATH is
          # stripped, plus the bionic ARG_MAX fix and talloc's headers.
          sed -i "s|^LDFLAGS  += -ltalloc .*|LDFLAGS  += -L$TALLOC_OUT/lib -l:libtalloc.so -Wl,-z,noexecstack '-Wl,-rpath,\$\$ORIGIN'|" src/GNUmakefile
          sed -i "s|^CPPFLAGS += \(.*\)$|CPPFLAGS += -DARG_MAX=131072 -I$TALLOC_OUT/include \1|" src/GNUmakefile
          # The warning suppressions and the unbundled-loader define go INTO the
          # makefile's own CFLAGS line: a command-line CFLAGS= would override the
          # makefile's `+=` and silently lose -DPROOT_UNBUNDLE_LOADER.
          sed -i 's|^CFLAGS\( *\) += -Wall -Wextra -O2.*$|CFLAGS\1 += -Wall -Wextra -O2 -Wno-error -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types|' src/GNUmakefile
          grep -q 'l:libtalloc.so' src/GNUmakefile || { echo "talloc LDFLAGS patch did not apply"; exit 1; }
          grep -q 'HAS_LOADER_32BIT true' src/arch.h && { echo "loader32 patch did not apply"; exit 1; }
          make -C src \
            CC="$TOOLCHAIN/bin/aarch64-linux-android28-clang" \
            LD="$TOOLCHAIN/bin/aarch64-linux-android28-clang" \
            STRIP="$TOOLCHAIN/bin/llvm-strip" \
            OBJCOPY="$TOOLCHAIN/bin/llvm-objcopy" \
            OBJDUMP="$TOOLCHAIN/bin/llvm-objdump" \
            PROOT_UNBUNDLE_LOADER=libproot-loader.so \
            -j"$(nproc)"
          # Verify the ELF shape the runtime depends on before calling this a build.
          "$TOOLCHAIN/bin/llvm-readelf" -d src/proot | tee /tmp/proot-dynamic.txt
          grep -q 'Library runpath: \[\$ORIGIN\]' /tmp/proot-dynamic.txt
          grep -q 'Shared library: \[libtalloc.so\]' /tmp/proot-dynamic.txt
          if grep -q 'libtalloc.so\.2' /tmp/proot-dynamic.txt; then
            echo "DT_NEEDED still references libtalloc.so.2 - the SONAME respell is wrong"; exit 1
          fi
          "$TOOLCHAIN/bin/llvm-readelf" -h src/proot | grep -q AArch64
          # Name the outputs the way jniLibs expects them, for inspection only.
          mkdir -p "$GITHUB_WORKSPACE/proot-out"
          cp src/proot "$GITHUB_WORKSPACE/proot-out/libproot.so"
          cp src/loader/loader "$GITHUB_WORKSPACE/proot-out/libproot-loader.so"
          (cd "$GITHUB_WORKSPACE/proot-out" && sha256sum libproot.so libproot-loader.so | tee SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: |
            proot-out/libproot.so
            proot-out/libproot-loader.so
            proot-out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

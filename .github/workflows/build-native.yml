name: build-native

# Manual only: builds the native payload (box64 + proot) for arm64-v8a so a
# human can inspect the binaries and vendor them into
# app/src/main/jniLibs/arm64-v8a/ (see docs/NATIVE_RUNTIME.md). Vendoring
# proot is an owner decision: it is GPL-2.0 and needs an Android-patched fork.
# This workflow never blocks the APK build.

on:
  workflow_dispatch:
    inputs:
      box64_ref:
        description: 'box64 git ref (tag/branch/commit)'
        required: false
        default: 'v0.4.4'
      proot_repo:
        description: 'proot fork (must carry the Android patches)'
        required: false
        default: 'https://github.com/twaik/proot.git'
      proot_ref:
        description: 'proot git ref'
        required: false
        default: 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  box64:
    name: box64 (arm64 Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build box64 with the NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)}"
          echo "Using NDK: $NDK"
          git clone --depth 1 --branch "${{ inputs.box64_ref }}" https://github.com/ptitSeb/box64.git box64 || \
            git clone --depth 1 https://github.com/ptitSeb/box64.git box64
          cd box64
          mkdir build && cd build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DARM_DYNAREC=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          make -j"$(nproc)"
          # The APK ships it as libbox64.so (AGP only packages lib*.so);
          # rename here so the artifact is drop-in for jniLibs/arm64-v8a.
          cp box64 libbox64.so
          sha256sum libbox64.so | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: box64-arm64
          path: |
            box64/build/libbox64.so
            box64/build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  proot:
    name: proot (arm64 Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build proot with the NDK
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          git clone --depth 1 --branch "${{ inputs.proot_ref }}" "${{ inputs.proot_repo }}" proot || \
            git clone --depth 1 "${{ inputs.proot_repo }}" proot
          cd proot/src
          make \
            CC="$TOOLCHAIN/bin/aarch64-linux-android28-clang" \
            LD="$TOOLCHAIN/bin/aarch64-linux-android28-clang" \
            ARCH=arm64 \
            -j"$(nproc)" || make CC="$TOOLCHAIN/bin/aarch64-linux-android28-clang" ARCH=arm64
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: |
            proot/src/proot
            proot/src/loader/loader
          if-no-files-found: warn
          retention-days: 30

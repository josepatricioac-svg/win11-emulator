name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the HTML from src parts
        working-directory: win11-emulator
        run: |
          python3 build.py
          cp ../win11-emulator.html android/app/src/main/assets/win11-emulator.html
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: win11-emulator/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: winlator11-debug-apk
          path: win11-emulator/android/app/build/outputs/apk/debug/*.apk
